":"薬をのむのを忘れました。","furigana":"くすり を のむ の を わすれました","romaji":"","es":"Se me olvidó tomar la medicina."},{"type":"section","text":"③ 〜のを知っていますか — saber que algo ocurre"},{"type":"grammar_box","text":"📌 〜のを知っていますか\nEstructura: [cláusula plain] + のを + 知っていますか\nPregunta si alguien conoce un hecho o evento. の nominaliza la cláusula entera para que funcione como objeto de 知る."},{"type":"example","jp":"あした田中さんがたいいんするのを知っていますか。","furigana":"あした たなかさん が たいいん する の を しって いますか","romaji":"","es":"¿Sabe que el señor Tanaka sale del hospital mañana?"},{"type":"example","jp":"駅前に大きなホテルができたのを知っていますか。","furigana":"えきまえ に おおきな ほてる が できた の を しって いますか","romaji":"","es":"¿Sabe que se construyó un gran hotel frente a la estación?"},{"type":"section","text":"④ 〜のは〜です — identificar/definir"},{"type":"example","jp":"父がうまれたのは北海道の小さな村です。","furigana":"ちち が うまれた の は ほっかいどう の ちいさな むら です","romaji":"","es":"El lugar donde nació mi padre es un pequeño pueblo de Hokkaido."},{"type":"example","jp":"わたしがほしいのはイタリア製の靴です。","furigana":"わたし が ほしい の は いたりあせい の くつ です","romaji":"","es":"Lo que quiero son zapatos fabricados en Italia."}]},{"num":39,"title":"て形 ampliada: causas / ので / のに","description":"Se amplían los usos de la forma て para expresar causas o razones, y se introducen ので (porque, razón objetiva) y のに (aunque, contraste inesperado).","content":[{"type":"grammar_box","text":"📌 ので / のに — razón objetiva y contraste\nEstructura: [cláusula plain/te] + ので + [resultado] = porque (objetivo)\n[cláusula plain/te] + のに + [resultado] = aunque / a pesar de que (contraste)\nので expresa una razón natural u objetiva, más suave que から. のに expresa que el resultado es contrario a lo esperado; implica sorpresa o queja."},{"type":"section","text":"① て形 para causa o contexto"},{"type":"grammar_box","text":"メールをよんで、安心しました。\n【めーる を よんで、あんしん しました】\nMēru o yonde, anshin shimashita.\n→ Leí el correo y me quedé tranquilo. (te = causa/resultado)"},{"type":"grammar_box","text":"家族にあえなくて、寂しいです。\n【かぞく に あえなくて、さびしい です】\nKazoku ni aenakute, sabishii desu.\n→ No puedo ver a mi familia y me siento solo. (te negativo = razón)"},{"type":"example","jp":"問題がむずかしくて、わかりません。","furigana":"もんだい が むずかしくて、わかりません","romaji":"","es":"Los problemas son difíciles y no los entiendo."},{"type":"section","text":"② ので — porque (razón objetiva y suave)"},{"type":"example","jp":"病院へいくので、５時に帰ってもいいですか。","furigana":"びょういん へ いく ので、ごじ に かえって も いいですか","romaji":"","es":"Como voy al hospital, ¿está bien si vuelvo a las 5?"},{"type":"example","jp":"バスがおくれたので、約束に間に合いませんでした。","furigana":"ばす が おくれた ので、やくそく に まに あいませんでした","romaji":"","es":"Como el autobús se retrasó, no llegué a tiempo a la cita."},{"type":"section","text":"③ のに — aunque (contraste inesperado / queja)"},{"type":"example","jp":"一生懸命べんきょうしたのに、試験の点が悪かったです。","furigana":"いっしょうけんめい べんきょう した のに、しけん の てん が わるかった です","romaji":"","es":"Aunque estudié muchísimo, mis notas en el examen fueron malas."},{"type":"example","jp":"30分もまっているのに、タクシーが来ません。","furigana":"さんじゅっぷん も まって いる のに、たくしー が きません","romaji":"","es":"Aunque llevo esperando 30 minutos, el taxi no llega."}]},{"num":40,"title":"〜かどうか / 〜かわかりません / て + みます","description":"Se introduce la estructura para expresar incertidumbre sobre si algo es verdad o no (かどうか), preguntas indirectas (か〜かわかりません) y てみます para probar o intentar algo.","content":[{"type":"grammar_box","text":"📌 かどうか / 疑問詞+か / てみます\nEstructura: [cláusula plain] + かどうか + 確かめてください/わかりません = si... o no\n疑問詞 + [cláusula plain] + か + わかりません = no sé qué/cuándo/dónde...\n[verbo て] + みます = probar a hacer algo, intentar\nかどうか = 'si... o no' (sí/no indirecto). 疑問詞+か embute una pregunta dentro de otra oración. てみます expresa tentativa: hacer algo para ver qué pasa."},{"type":"section","text":"① かどうか — si... o no"},{"type":"example","jp":"会議室がつかえるかどうか、確かめてください。","furigana":"かいぎしつ が つかえる か どうか、たしかめて ください","romaji":"","es":"Por favor comprueba si se puede usar la sala de reuniones."},{"type":"example","jp":"その話はほんとうかどうか、わかりません。","furigana":"その はなし は ほんとう か どうか、わかりません","romaji":"","es":"No sé si esa historia es verdad o no."},{"type":"section","text":"② 疑問詞+か — preguntas indirectas"},{"type":"example","jp":"どんな問題が試験にでるか、わかりません。","furigana":"どんな もんだい が しけん に でる か、わかりません","romaji":"","es":"No sé qué tipo de preguntas saldrán en el examen."},{"type":"example","jp":"なんじに試験がはじまるか、わかりません。","furigana":"なんじ に しけん が はじまる か、わかりません","romaji":"","es":"No sé a qué hora empieza el examen."},{"type":"section","text":"③ て + みます — probar / intentar"},{"type":"grammar_box","text":"📌 てみます — intentar, probar\nEstructura: [verbo て] + みます\nみます (ver) añadido a la forma て expresa que se hace algo para ver el resultado. Equivale a 'probar a...', 'intentar...' o 'a ver si...'. No implica éxito."},{"type":"example","jp":"この靴をはいてみます。","furigana":"この くつ を はいて みます","romaji":"","es":"Voy a probarme estos zapatos."},{"type":"example","jp":"先生にきいてみます。","furigana":"せんせい に きいて みます","romaji":"","es":"Voy a intentar preguntarle al profesor."},{"type":"example","jp":"日本語でせつめいしてみます。","furigana":"にほんご で せつめい して みます","romaji":"","es":"Voy a intentar explicarlo en japonés."}]},{"num":41,"title":"いただきます / くださいます / やります (Dar/recibir con jerarquía)","description":"Se amplía el sistema de dar y recibir con formas más formales y respetuosas: いただきます (recibir con humildad) y くださいます (recibir de alguien superior), y やります para dar a inferiores o animales.","content":[{"type":"grammar_box","text":"📌 いただきます / くださいます / やります\nEstructura: いただきます = recibir (yo, de alguien superior) — humilde\nくださいます = dar (alguien superior, a mí) — respetuoso\nやります = dar (a inferiores: niños pequeños, animales, plantas)\nTe+いただきます / て+くださいます = recibir el favor de que alguien haga algo\nLa jerarquía social determina qué verbo se usa. いただく es la forma humilde de もらう. くださる es la forma respetuosa de くれる. やる es la forma informal/descendente de あげる."},{"type":"section","text":"① いただきました / くださいました — recibir con respeto"},{"type":"example","jp":"わたしはしゃちょうにお土産をいただきました。","furigana":"わたし は しゃちょう に おみやげ を いただきました","romaji":"","es":"Recibí un regalo del presidente (de la empresa)."},{"type":"example","jp":"しゃちょうがわたしにお土産をくださいました。","furigana":"しゃちょう が わたし に おみやげ を くださいました","romaji":"","es":"El presidente me dio un regalo."},{"type":"section","text":"② やりました — dar a inferiores/animales"},{"type":"example","jp":"わたしはまごにお菓子をやりました。","furigana":"わたし は まご に おかし を やりました","romaji":"","es":"Le di dulces a mi nieto."},{"type":"example","jp":"ねこにえさをやりました。","furigana":"ねこ に えさ を やりました","romaji":"","es":"Le di comida al gato."},{"type":"section","text":"③ て + いただきました / くださいました — favor recibido"},{"type":"grammar_box","text":"📌 て + いただきました / くださいました\nEstructura: [verbo て] + いただきました = recibí el favor de que X (superior) hiciera\n[verbo て] + くださいました = X (superior) me hizo el favor de\nEstas formas expresan gratitud por un favor recibido de alguien de rango superior. Son formas muy educadas y frecuentes en contextos formales."},{"type":"example","jp":"先生に旅行の写真をみせていただきました。","furigana":"せんせい に りょこう の しゃしん を みせて いただきました","romaji":"","es":"El profesor me mostró fotos del viaje (y se lo agradezco)."},{"type":"example","jp":"先生が旅行の写真をみせてくださいました。","furigana":"せんせい が りょこう の しゃしん を みせて くださいました","romaji":"","es":"El profesor tuvo la amabilidad de mostrarme fotos del viaje."},{"type":"section","text":"④ て + やりました — hacer algo por inferiores"},{"type":"example","jp":"わたしは孫に英語をおしえてやりました。","furigana":"わたし は まご に えいご を おしえて やりました","romaji":"","es":"Le enseñé inglés a mi nieto."},{"type":"section","text":"⑤ て + くださいませんか — petición respetuosa"},{"type":"example","jp":"ひらがなでかいてくださいませんか。","furigana":"ひらがな で かいて くださいませんか","romaji":"","es":"¿Le importaría escribirlo en hiragana? (petición muy educada)"}]},{"num":42,"title":"ために (finalidad / causa) / のに (para lograr algo)","description":"ために expresa finalidad (para hacer algo) o causa (a causa de). のに expresa el medio o recurso necesario para lograr algo.","content":[{"type":"grammar_box","text":"📌 ために y のに\nEstructura: [verbo diccionario / sustantivo+の] + ために + [acción] = para (finalidad)\n[verbo diccionario / sustantivo] + のに + [recurso] = para (lograr algo, recurso necesario)\nために con verbo = finalidad voluntaria. ために con sustantivo = causa ('a causa de'). のに expresa el costo o recurso necesario para alcanzar algo (かかります, つかいます, etc.)."},{"type":"section","text":"① ために — finalidad"},{"type":"example","jp":"家を買うために、一生懸命働きます。","furigana":"いえ を かう ために、いっしょうけんめい はたらきます","romaji":"","es":"Trabajo con todas mis fuerzas para comprar una casa."},{"type":"example","jp":"しょうらいのかぞくのために、一生懸命働きます。","furigana":"しょうらい の かぞく の ために、いっしょうけんめい はたらきます","romaji":"","es":"Trabajo duro para el futuro de mi familia."},{"type":"section","text":"② のに — recurso/costo necesario"},{"type":"example","jp":"このかばんは絵をはこぶのに使います。","furigana":"この かばん は え を はこぶ の に つかいます","romaji":"","es":"Esta bolsa se usa para transportar cuadros."},{"type":"example","jp":"家をたてるのに2,000万円かかります。","furigana":"いえ を たてる の に にせんまんえん かかります","romaji":"","es":"Para construir una casa cuesta 20 millones de yenes."},{"type":"example","jp":"ひっこしするのに２日かかります。","furigana":"ひっこし する の に ふつか かかります","romaji":"","es":"Para mudarse se tardan 2 días."}]},{"num":43,"title":"〜そうです (apariencia) / て + きます","description":"そうです con forma de adjetivo o verbo expresa que algo 'parece' o 'tiene pinta de' cierto estado. て + きます describe un cambio gradual que se está produciendo.","content":[{"type":"grammar_box","text":"📌 〜そうです (apariencia) / て + きます\nEstructura: Adj-い: い→そうです / Adj-な: な→そうです / Verbo: ます stem→そうです\n= parece que..., tiene pinta de..., está a punto de...\n[verbo て] + きます = ha empezado a..., viene cambiando (cambio gradual hacia el presente)\n⚠️ いい→よさそう (irregular). そうです de apariencia se distingue del そうです de rumor (cláusula plain+そうです). て+きます indica un proceso que comenzó en el pasado y continúa ahora."},{"type":"section","text":"① 〜そうです — apariencia / parecer"},{"type":"table","rows":[["Tipo","Forma base","Forma そう"],["adj-い","たかい","たかそうです"],["adj-い (irreg.)","いい","よさそうです ⚠️"],["adj-な","やさしい (na)","やさしそうです"],["verbo","おちます (ます stem)","おちそうです"]]},{"type":"example","jp":"今にも火がきえそうです。","furigana":"いま に も ひ が きえ そう です","romaji":"","es":"Parece que el fuego va a apagarse en cualquier momento."},{"type":"example","jp":"この料理はまずそうです。","furigana":"この りょうり は まず そう です","romaji":"","es":"Esta comida tiene pinta de estar mala."},{"type":"example","jp":"彼女はやさしそうです。","furigana":"かのじょ は やさし そう です","romaji":"","es":"Ella parece amable."},{"type":"section","text":"② て + きます — cambio gradual hacia ahora"},{"type":"example","jp":"あしたは暑くなりそうです。","furigana":"あした は あつく なり そう です","romaji":"","es":"Parece que mañana va a hacer más calor."},{"type":"example","jp":"ちょっと飲み物をかってきます。","furigana":"ちょっと のみもの を かって きます","romaji":"","es":"Voy a comprar algo de beber y vuelvo. (ir, hacer y volver)"}]},{"num":44,"title":"すぎます / やすい・にくい / 〜く/にします","description":"Se aprenden modificadores que se añaden al verbo o adjetivo: すぎ (exceso), やすい/にくい (facilidad/dificultad), y 〜くする/にする (convertir en cierto estado).","content":[{"type":"grammar_box","text":"📌 すぎます / やすい・にくい / 〜くする・にする\nEstructura: ます stem + すぎます = demasiado\nます stem + やすいです = fácil de hacer\nます stem + にくいです = difícil de hacer\nadj-い: い→くします / adj-な/sust.: にします = hacer que sea / convertir en\nすぎ expresa exceso de cantidad o grado. やすい/にくい describen la facilidad o dificultad inherente del objeto. 〜くする/にする expresa que alguien convierte algo en otro estado."},{"type":"section","text":"① すぎます — demasiado"},{"type":"example","jp":"お土産をかいすぎました。","furigana":"おみやげ を かい すぎました","romaji":"","es":"Compré demasiados souvenirs."},{"type":"example","jp":"ごはんをたべすぎました。","furigana":"ごはん を たべ すぎました","romaji":"","es":"Comí demasiado."},{"type":"example","jp":"この部屋はせますぎます。","furigana":"この へや は せま すぎます","romaji":"","es":"Esta habitación es demasiado pequeña."},{"type":"section","text":"② やすい / にくい — facilidad o dificultad"},{"type":"example","jp":"この薬はのみやすいです。","furigana":"この くすり は のみ やすい です","romaji":"","es":"Esta medicina es fácil de tomar."},{"type":"example","jp":"東京はすみにくいです。","furigana":"とうきょう は すみ にくい です","romaji":"","es":"Tokio es difícil para vivir."},{"type":"example","jp":"このコップはわれにくいです。","furigana":"この こっぷ は われ にくい です","romaji":"","es":"Este vaso es difícil de romper."},{"type":"section","text":"③ 〜くします / 〜にします — cambiar el estado"},{"type":"example","jp":"髪をみじかくします。","furigana":"かみ を みじかく します","romaji":"","es":"Me voy a cortar el pelo (hacerlo más corto)."},{"type":"example","jp":"部屋をきれいにします。","furigana":"へや を きれい に します","romaji":"","es":"Voy a poner la habitación bonita / ordenar."},{"type":"example","jp":"晩ごはんはカレーライスにします。","furigana":"ばんごはん は かれーらいす に します","romaji":"","es":"Voy a optar por curry para la cena. (decidir/elegir)"}]},{"num":45,"title":"〜場合は / のに (contraste) / ところです","description":"Se introduce 場合は para condicionales formales ('en caso de que'), y se amplía のに en su uso adversativo para expresar contradicción o decepción.","content":[{"type":"grammar_box","text":"📌 〜場合は / 〜のに\nEstructura: [verbo/adj plain / sustantivo] + 場合は + [acción] = en caso de que...\n[cláusula plain] + のに + [resultado contrario] = a pesar de que... / aunque...\n場合 (ばあい) = caso, situación. 場合は se usa en situaciones formales, instrucciones y condiciones hipotéticas. Es más formal que たら o と. のに con queja expresa decepción fuerte: el hablante esperaba un resultado diferente."},{"type":"section","text":"① 〜場合は — en caso de que (formal)"},{"type":"example","jp":"会社におくれる場合は、連絡してください。","furigana":"かいしゃ に おくれる ばあい は、れんらく して ください","romaji":"","es":"En caso de llegar tarde a la empresa, por favor avise."},{"type":"example","jp":"荷物がつかない場合は、連絡してください。","furigana":"にもつ が つかない ばあい は、れんらく して ください","romaji":"","es":"En caso de que el equipaje no llegue, por favor contáctenos."},{"type":"example","jp":"コピー機の調子がわるい場合は、連絡してください。","furigana":"こぴーき の ちょうし が わるい ばあい は、れんらく して ください","romaji":"","es":"En caso de que la fotocopiadora funcione mal, avísenos."},{"type":"section","text":"② のに — contraste y queja"},{"type":"example","jp":"一生懸命べんきょうしたのに、試験の点が悪かったです。","furigana":"いっしょうけんめい べんきょう した のに、しけん の てん が わるかった です","romaji":"","es":"Aunque estudié muchísimo, saqué mala nota en el examen."},{"type":"example","jp":"このレストランはおいしくないのに、値段が高いです。","furigana":"この れすとらん は おいしくない のに、ねだん が たかい です","romaji":"","es":"Aunque este restaurante no está bueno, los precios son altos."}]},{"num":46,"title":"ところです / ばかりです / はずです","description":"Tres expresiones para hablar de momento temporal de una acción: ところ (justo ahora), ばかり (acaba de), はず (se supone que / debería ser).","content":[{"type":"grammar_box","text":"📌 ところです / ばかりです / はずです\nEstructura: [verbo diccionario] + ところです = estar a punto de\n[verbo て] + いる + ところです = estar justo haciendo\n[verbo た] + ところです = acabar de\n[verbo た] + ばかりです = hace muy poco que\n[cláusula plain] + はずです = se supone que / debería ser\nところ indica el momento preciso de la acción. ばかり enfatiza que la acción acaba de ocurrir y que no ha pasado tiempo. はずです expresa expectativa o deducción lógica basada en información."},{"type":"section","text":"① ところです — momento preciso"},{"type":"example","jp":"ちょうど今から試合がはじまるところです。","furigana":"ちょうど いま から しあい が はじまる ところ です","romaji":"","es":"El partido está a punto de empezar justo ahora."},{"type":"example","jp":"今部屋をかたづけているところです。","furigana":"いま へや を かたづけて いる ところ です","romaji":"","es":"Ahora mismo estoy justo ordenando la habitación."},{"type":"example","jp":"うちへかえってきたところです。","furigana":"うち へ かえって きた ところ です","romaji":"","es":"Acabo de llegar a casa."},{"type":"section","text":"② ばかりです — hace muy poco"},{"type":"example","jp":"わたしはさっき昼ごはんを食べたばかりです。","furigana":"わたし は さっき ひるごはん を たべた ばかり です","romaji":"","es":"Acabo de comer hace un momento."},{"type":"example","jp":"ワットさんは先月けっこんしたばかりです。","furigana":"わっとさん は せんげつ けっこん した ばかり です","romaji":"","es":"El señor Watt se acaba de casar el mes pasado."},{"type":"section","text":"③ はずです — se supone que / debería"},{"type":"example","jp":"荷物はあしたとどくはずです。","furigana":"にもつ は あした とどく はず です","romaji":"","es":"Se supone que el equipaje llega mañana."},{"type":"example","jp":"グプタさんはお酒をのまないはずです。","furigana":"ぐぷたさん は おさけ を のまない はず です","romaji":"","es":"Se supone que el señor Gupta no bebe alcohol."},{"type":"example","jp":"課長はドイツ語がじょうずなはずです。","furigana":"かちょう は どいつご が じょうずな はず です","romaji":"","es":"Se supone que el jefe de sección es bueno en alemán."}]},{"num":47,"title":"〜そうです (rumor/información) / 〜ようです (apariencia/deducción)","description":"Se distinguen dos usos de そうです: el de apariencia (lección 43) y el de rumor o información oída. Se introduce ようです para expresar deducciones basadas en evidencia.","content":[{"type":"grammar_box","text":"📌 そうです (rumor) vs ようです (deducción)\nEstructura: [cláusula plain completa] + そうです = he oído que..., dicen que... (información de segunda mano)\n[cláusula plain completa] + ようです = parece que..., da la impresión de que... (deducción propia)\n⚠️ DIFERENCIA CLAVE: そうです de rumor usa la cláusula COMPLETA en plain form. そうです de apariencia usa solo el STEM (ます stem o adj sin い). ようです = deducción del hablante basada en lo que observa."},{"type":"section","text":"① そうです — rumor / información oída"},{"type":"example","jp":"あしたは雪がふるそうです。","furigana":"あした は ゆき が ふる そう です","romaji":"","es":"He oído que mañana nevará. (rumor/información)"},{"type":"example","jp":"台風はこないそうです。","furigana":"たいふう は こない そう です","romaji":"","es":"Dicen que el tifón no vendrá."},{"type":"example","jp":"さっぽろの雪祭りはきれいだそうです。","furigana":"さっぽろ の ゆきまつり は きれいだ そう です","romaji":"","es":"He oído que el Festival de la Nieve de Sapporo es precioso."},{"type":"example","jp":"あしたの天気はくもりだそうです。","furigana":"あした の てんき は くもりだ そう です","romaji":"","es":"Dicen que el tiempo de mañana será nublado."},{"type":"section","text":"② ようです — deducción / apariencia basada en evidencia"},{"type":"example","jp":"コンサートがはじまるようです。","furigana":"こんさーと が はじまる よう です","romaji":"","es":"Parece que el concierto está a punto de empezar."},{"type":"example","jp":"課長は事務所にいないようです。","furigana":"かちょう は じむしょ に いない よう です","romaji":"","es":"Parece que el jefe de sección no está en la oficina."},{"type":"example","jp":"部長は甘い物がすきなようです。","furigana":"ぶちょう は あまい もの が すきな よう です","romaji":"","es":"Parece que al director le gustan los dulces."}]},{"num":48,"title":"Voz causativa (使役形・しえきけい)","description":"La voz causativa expresa que alguien hace que otro haga algo, o permite que alguien haga algo. Es equivalente a 'hacer hacer' o 'dejar hacer' en español.","content":[{"type":"grammar_box","text":"📌 Formación de la voz causativa\nEstructura: Grupo I: última sílaba → あ段 + せます (う→わせます)\nGrupo II: ます stem + させます\nGrupo III: きます → こさせます / します → させます\nDos usos: (1) CAUSAR: [persona] に [acción] させます = hacer que alguien haga algo (obligar). (2) PERMITIR: [persona] に [acción] させます = dejar que alguien haga algo. El contexto determina cuál es."},{"type":"section","text":"① Conjugación causativa"},{"type":"table","rows":[["Forma ます","Forma causativa"],["てつだいます → てつだわせます","かきます → かかせます"],["いそぎます → いそがせます","なおします → なおさせます"],["もちます → もたせます","はこびます → はこばせます"],["のみます → のませます","たべます → たべさせます"],["しらべます → しらべさせます","きます → こさせます ⚠️"],["します → させます ⚠️"]]},{"type":"section","text":"② Causativa para obligar (〜させます)"},{"type":"example","jp":"部長はミラーさんをアメリカへしゅっちょうさせました。","furigana":"ぶちょう は みらーさん を あめりか へ しゅっちょう させました","romaji":"","es":"El director envió al señor Miller en viaje de negocios a EE. UU."},{"type":"example","jp":"わたしはこどもに本をよませます。","furigana":"わたし は こども に ほん を よませます","romaji":"","es":"Hago que mi hijo lea libros."},{"type":"section","text":"③ Causativa para permitir / libre albedrío"},{"type":"example","jp":"わたしはむすこを好きな人とけっこんさせました。","furigana":"わたし は むすこ を すきな ひと と けっこん させました","romaji":"","es":"Dejé que mi hijo se casara con la persona que quiere."},{"type":"example","jp":"わたしはこどもにすきなしごとをさせます。","furigana":"わたし は こども に すきな しごと を させます","romaji":"","es":"Dejo que mi hijo haga el trabajo que le gusta."},{"type":"section","text":"④ Causativa + いただけませんか — pedir permiso con humildad"},{"type":"example","jp":"すみませんが、あしたやすませていただけませんか。","furigana" // AUDIO — iOS Safari (probado y funcional)
// ═══════════════════════════════════════════════
// Reglas clave iOS:
//  1. speak() debe ejecutarse SINCRÓNICAMENTE en el mismo
//     evento de toque del usuario — sin setTimeout ni promesas
//  2. El primer speak() desbloquea el engine (iOS necesita
//     un utterance REAL, no vacío, para activarse)
//  3. Siempre cancel() antes de un nuevo speak()
//  4. Asignar la voz DESPUÉS de getVoices() dentro del toque
// ═══════════════════════════════════════════════
let tts = window.speechSynthesis || null;
let currentAudioBtn = null;
let ttsWatchdog = null;

function getJpVoice() {
  if (!tts) return null;
  const v = tts.getVoices();
  return v.find(x => x.lang === 'ja-JP' && x.localService)
      || v.find(x => x.lang === 'ja-JP')
      || v.find(x => x.lang.startsWith('ja'))
      || null;
}

// Llamar en onvoiceschanged para precargar cuando iOS las cargue
if (tts) tts.onvoiceschanged = () => getJpVoice();

function speakJP(text, btnEl) {
  if (!tts) {
    alert('Tu navegador no soporta síntesis de voz.');
    return;
  }

  // — Cancelar lo que esté sonando —
  tts.cancel();
  if (ttsWatchdog) { clearTimeout(ttsWatchdog); ttsWatchdog = null; }

  // — Resetear botón anterior —
  if (currentAudioBtn && currentAudioBtn !== btnEl) {
    currentAudioBtn.textContent = '🔊';
    currentAudioBtn.classList.remove('playing');
  }

  // — Limpiar texto (quitar furigana y paréntesis) —
  const clean = text
    .replace(/【[^】]*】/g, '')
    .replace(/（[^）]*）/g, '')
    .replace(/\([^)]*\)/g, '')
    .replace(/[。、！？]/g, ' ')
    .trim();

  if (!clean) return;

  // — Crear utterance —
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang   = 'ja-JP';
  utt.rate   = 0.8;
  utt.pitch  = 1.0;
  utt.volume = 1.0;

  // Asignar voz aquí (dentro del gesto del usuario = funciona en iOS)
  const voice = getJpVoice();
  if (voice) utt.voice = voice;

  // — Estado del botón —
  if (btnEl) {
    btnEl.textContent = '⏹';
    btnEl.classList.add('playing');
    currentAudioBtn = btnEl;
  }

  const resetBtn = () => {
    if (ttsWatchdog) { clearTimeout(ttsWatchdog); ttsWatchdog = null; }
    if (btnEl) { btnEl.textContent = '🔊'; btnEl.classList.remove('playing'); }
    if (currentAudioBtn === btnEl) currentAudioBtn = null;
  };

  utt.onend   = resetBtn;
  utt.onerror = (e) => { if (e.error !== 'interrupted') console.warn('TTS:', e.error); resetBtn(); };

  // — Hablar (sincrónico, dentro del evento de toque) —
  tts.speak(utt);

  // Watchdog por si iOS se cuelga sin disparar onend
  const ms = Math.max(4000, clean.length * 200 + 2000);
  ttsWatchdog = setTimeout(() => { tts.cancel(); resetBtn(); }, ms);
}

// HELPERS

const COLORS = ['#E94560','#FF6B35','#F5A623','#00B894','#00CEC9','#A29BFE','#FD79A8','#74B9FF','#F5A623','#E94560'];
function numColor(n){ return COLORS[n % COLORS.length]; }
function levelClass(n){ return n<=25?'n5':n<=40?'n4':'n3'; }
function levelLabel(n){ return n<=25?'N5':n<=40?'N4':'N3'; }

// ══════════════════════════════════════════════════════════════
// LESSON LIST
// ══════════════════════════════════════════════════════════════
function renderLessons(q='') {
  const ql = q.toLowerCase();
  let list = LESSONS.filter(l => {
    if(ql) return (
      l.title.toLowerCase().includes(ql) ||
      l.description.toLowerCase().includes(ql) ||
      l.content.some(c =>
        (c.text||'').toLowerCase().includes(ql) ||
        (c.jp||'').includes(ql) ||
        (c.furigana||'').includes(ql) ||
        (c.romaji||'').toLowerCase().includes(ql) ||
        (c.es||'').toLowerCase().includes(ql) ||
        (c.rows||[]).some(row=>row.some(cell=>cell.toLowerCase().includes(ql)))
      )
    );
    if(currentFilter==='done') return !!state.done[l.num];
    if(currentFilter==='pending') return !state.done[l.num];
    if(currentFilter==='fav') return !!state.favs[l.num];
    if(currentFilter==='n5') return l.num<=25;
    if(currentFilter==='n4') return l.num>25&&l.num<=40;
    if(currentFilter==='n3') return l.num>40;
    return true;
  });

  const el = document.getElementById('lessons-list');
  if(!list.length){ el.innerHTML=`<div class="empty"><div class="ei">🔍</div><p>Sin resultados</p></div>`; return; }

  if(ql) {
    el.innerHTML = `<div class="sec-head">${list.length} resultado${list.length!==1?'s':''}</div>` +
      list.map(lessonCardHtml).join('');
    return;
  }

  const groups = [
    {label:'N5 — Básico', items: list.filter(l=>l.num<=25)},
    {label:'N4 — Intermedio', items: list.filter(l=>l.num>25&&l.num<=40)},
    {label:'N3 — Avanzado', items: list.filter(l=>l.num>40)},
  ].filter(g=>g.items.length);

  el.innerHTML = groups.map(g =>
    `<div class="sec-head">${g.label} · ${g.items.length} lecc.</div>` +
    g.items.map(lessonCardHtml).join('')
  ).join('');
}

function lessonCardHtml(l) {
  const done = !!state.done[l.num];
  const fav  = !!state.favs[l.num];
  const exs  = l.content.filter(c=>c.type==='example');
  const sub  = l.content.filter(c=>c.type==='section').map(c=>c.text.replace(/^[①②③④⑤⑥⑦⑧⑨]\s*/,'')).slice(0,2).join(' · ') || l.description.slice(0,60);
  return `<div class="lcard ${done?'done':''}" onclick="openLesson(${l.num})">
    <div class="lnum" style="background:${numColor(l.num)}">${l.num}</div>
    <div class="linfo">
      <div class="ltitle">${l.title}</div>
      <div class="lsub">${sub}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
      <span class="lvl ${levelClass(l.num)}">${levelLabel(l.num)}</span>
      <span style="font-size:12px">${done?'✅':''}${fav?'⭐':''}</span>
    </div>
  </div>`;
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  renderLessons();
}

    <button onclick="toggleFurigana()" id="furi-toggle" style="background:${state.showFurigana?'rgba(162,155,254,.2)':'var(--bg3)'};border:1px solid ${state.showFurigana?'var(--purple)':'var(--border)'};color:${state.showFurigana?'var(--purple)':'var(--muted)'};border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700">🈺 Furigana</button>
    <button onclick="toggleRomaji()" id="roma-toggle" style="background:${state.showRomaji?'rgba(0,206,201,.2)':'var(--bg3)'};border:1px solid ${state.showRomaji?'var(--teal)':'var(--border)'};color:${state.showRomaji?'var(--teal)':'var(--muted)'};border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700">🔤 Romaji</button>
    <button onclick="revealAll()" style="background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700">👁 Ver traducciones</button>
  </div>`;

  // Content
  let inExSection = false;
  for(const item of l.content) {
    if(item.type === 'section') {
      html += `<div class="point-head">${item.text}</div>`;
      inExSection = false;
    } else if(item.type === 'grammar_box') {
      html += renderGrammarBox(item.text);
    } else if(item.type === 'table') {
      html += renderTable(item.rows);
    } else if(item.type === 'example') {
      if(!inExSection) {
        html += `<div class="d-section-head">Ejemplos — toca 🔊 para escuchar, toca la traducción para revelar</div>`;
        inExSection = true;
      }
      html += renderExample(item, true);
    } else if(item.type === 'note') {
      html += `<div class="note">${item.text}</div>`;
    }
  }

  html += `<button class="done-btn ${done?'unmark':'mark'}" onclick="toggleDone(${num})">
    ${done?'↩ Marcar como pendiente':'✓ Marcar como completada'}
  </button>`;

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('s-detail').scrollTop = 0;
}

function renderGrammarBox(text) {
  const lines = text.split('\n');
  const title = lines[0].startsWith('📌') ? lines[0] : '';
  const body = title ? lines.slice(1).join('\n') : text;
  return `<div class="gbox">${title?`<div class="gbox-title">${title}</div>`:''}${esc(body)}</div>`;
}

function renderTable(rows) {
  if(!rows || !rows.length) return '';
  const header = rows[0];
  const body = rows.slice(1);
  return `<div class="gtable-wrap"><table>
    <thead><tr>${header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${body.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function renderExample(item, hidden=true, idx='') {
  const showF = state.showFurigana && item.furigana;
  const showR = state.showRomaji && item.romaji;
  const btnId = `ab-${idx || Math.random().toString(36).slice(2)}`;
  const esId = `es-${idx || Math.random().toString(36).slice(2)}`;
  return `<div class="ex-card">
    <div class="ex-top">
      <div class="ex-text">
        <div class="ex-jp">${item.jp}</div>
        ${showF?`<div class="ex-furigana" id="furi-${esId}">【${item.furigana}】</div>`:''}
        ${showR&&item.romaji?`<div class="ex-romaji" id="roma-${esId}">${item.romaji}</div>`:''}
        <div class="ex-es ${hidden?'hidden':''}" id="${esId}" onclick="reveal(this)" data-es="${esc(item.es)}">${item.es}</div>
        ${hidden?`<div class="reveal-hint" id="hint-${esId}">Toca para ver</div>`:''}
      </div>
      <button class="audio-btn" id="${btnId}" onclick="speakJP(${JSON.stringify(item.jp)}, event.currentTarget)">🔊</button>
    </div>
  </div>`;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function reveal(el) {
  if(!el.classList.contains('hidden')) return;
  el.classList.remove('hidden');
  const hint = document.getElementById('hint-'+el.id);
  if(hint) hint.style.display='none';
}

function revealAll() {
  document.querySelectorAll('.ex-es.hidden').forEach(el=>{
    el.classList.remove('hidden');
    const hint = document.getElementById('hint-'+el.id);
    if(hint) hint.style.display='none';
  });
}

function toggleFurigana() {
  state.showFurigana = !state.showFurigana;
  save();
  if(currentLesson) openLesson(currentLesson);
}
function toggleRomaji() {
  state.showRomaji = !state.showRomaji;
  save();
  if(currentLesson) openLesson(currentLesson);
}

function toggleDone(num) {
  state.done[num] = !state.done[num];
  save();
  openLesson(num);
}

function toggleFav() {
  if(!currentLesson) return;
  state.favs[currentLesson] = !state.favs[currentLesson];
  document.getElementById('fav-btn').textContent = state.favs[currentLesson]?'⭐':'☆';
  save();
}

// ══════════════════════════════════════════════════════════════
// FLASHCARDS
// ══════════════════════════════════════════════════════════════
function startFlash(mode) {
  if(mode) fc.mode = mode;
  // Build pool from all examples
  let pool = [];
  LESSONS.forEach(l=>l.content.forEach(c=>{
    if(c.type==='example' && c.jp && c.es) pool.push({...c, lessonNum:l.num});
  }));
  pool = pool.sort(()=>Math.random()-.5);
  fc = { pool, idx:0, flipped:false, mode: fc.mode||'jp-es' };
  renderFlash();
}

function renderFlash() {
  const total = fc.pool.length;
  if(!total) {
    document.getElementById('flash-content').innerHTML=`<div class="empty"><div class="ei">📭</div><p>Sin ejemplos</p></div>`;
    return;
  }
  const item = fc.pool[fc.idx];
  const pct = ((fc.idx)/total*100).toFixed(0);
  const isJpFront = fc.mode==='jp-es';
  const front_content = isJpFront
    ? `<div class="cf-label">Japonés → Español</div>
       <div class="cf-jp">${item.jp}</div>
       ${state.showFurigana&&item.furigana?`<div class="cf-furi">【${item.furigana}】</div>`:''}
       ${state.showRomaji&&item.romaji?`<div class="cf-roma">${item.romaji}</div>`:''}
       <div class="cf-tap">Toca para ver la traducción</div>`
    : `<div class="cf-label">Español → Japonés</div>
       <div class="cf-es" style="font-size:20px;color:var(--ink)">${item.es}</div>
       <div class="cf-tap">Toca para ver en japonés</div>`;
  const back_content = isJpFront
    ? `<div class="cf-label">Traducción</div><div class="cf-es">${item.es}</div>
       <div style="font-size:11px;color:var(--muted);margin-top:5px">L${item.lessonNum}</div>`
    : `<div class="cf-label">Japonés</div>
       <div class="cf-jp">${item.jp}</div>
       ${state.showFurigana&&item.furigana?`<div class="cf-furi">【${item.furigana}】</div>`:''}
       ${state.showRomaji&&item.romaji?`<div class="cf-roma">${item.romaji}</div>`:''}`;

  document.getElementById('flash-content').innerHTML = `
    <div class="fc-top">
      <span class="fc-counter">${fc.idx+1} / ${total}</span>
      <button class="fc-mode-btn" onclick="startFlash(fc.mode==='jp-es'?'es-jp':'jp-es')">
        ${fc.mode==='jp-es'?'JP → ES':'ES → JP'}
      </button>
    </div>
    <div class="fc-progress"><div class="fc-fill" style="width:${pct}%"></div></div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card-3d ${fc.flipped?'flipped':''}" id="card3d">
        <div class="card-face card-front">${front_content}</div>
        <div class="card-face card-back">${back_content}</div>
      </div>
    </div>

    <button class="fc-audio-btn" style="display:flex;align-items:center;gap:6px;align-self:center;margin-bottom:10px" onclick="speakJP(${JSON.stringify(item.jp)}, event.currentTarget)">
      🔊 Escuchar pronunciación
    </button>

    <div class="fc-btns">
      <button class="fc-btn prev" onclick="fcNav(-1)">← Anterior</button>
      <button class="fc-btn flip" onclick="flipCard()">↻ Girar</button>
      <button class="fc-btn next" onclick="fcNav(1)">Siguiente →</button>
    </div>
    <div style="text-align:center;margin-top:10px;font-size:11px;color:var(--muted)">L${item.lessonNum} · ${state.showFurigana?'Furigana ON':'Furigana OFF'} · ${state.showRomaji?'Romaji ON':'Romaji OFF'}</div>
  `;
}

function flipCard() {
  fc.flipped = !fc.flipped;
  const c = document.getElementById('card3d');
  if(c) c.classList.toggle('flipped', fc.flipped);
}

function fcNav(dir) {
  tts && tts.cancel();
  fc.idx = (fc.idx + dir + fc.pool.length) % fc.pool.length;
  fc.flipped = false;
  renderFlash();
}

// ══════════════════════════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════════════════════════
function startQuiz() {
  let pool = [];
  LESSONS.forEach(l=>l.content.forEach(c=>{
    if(c.type==='example'&&c.jp&&c.es) pool.push({...c, lessonNum:l.num});
  }));
  pool = pool.sort(()=>Math.random()-.5).slice(0,20);
  qz = { pool, idx:0, score:0, answered:false };
  renderQuizQ();
}

function renderQuizQ() {
  if(qz.idx >= qz.pool.length) { renderQuizResult(); return; }
  const q = qz.pool[qz.idx];
  const pct = (qz.idx/qz.pool.length*100).toFixed(0);
  const others = qz.pool.map(p=>p.es).filter(e=>e!==q.es);
  const wrongs = others.sort(()=>Math.random()-.5).slice(0,3);
  const opts = [q.es,...wrongs].sort(()=>Math.random()-.5);
  const qid = 'q'+qz.idx;

  document.getElementById('quiz-content').innerHTML = `
    <div class="qz-top">
      <span class="qz-ctr">Pregunta ${qz.idx+1}/${qz.pool.length}</span>
      <span class="qz-score">✨ ${qz.score} pts</span>
    </div>
    <div class="qz-bar"><div class="qz-fill" style="width:${pct}%"></div></div>
    <div class="qz-card">
      <div class="qz-jp">${q.jp}</div>
      ${state.showFurigana&&q.furigana?`<div class="qz-furi">【${q.furigana}】</div>`:''}
      ${state.showRomaji&&q.romaji?`<div class="qz-roma">${q.romaji}</div>`:''}
      <div class="qz-ltag">Lección ${q.lessonNum}</div>
      <button class="qz-audio" onclick="speakJP(${JSON.stringify(q.jp)}, event.currentTarget)">🔊 Escuchar</button>
    </div>
    <div class="qz-opts">
      ${opts.map(o=>`<button class="qopt" data-ans="${encodeURIComponent(o)}" data-correct="${encodeURIComponent(q.es)}"
        onclick="answerQ(this)">${o}</button>`).join('')}
    </div>
    <div class="qz-fb" id="qz-fb"></div>
    <button class="qz-next" id="qz-next" onclick="nextQ()">Siguiente →</button>
  `;
}

function answerQ(btn) {
  if(qz.answered) return;
  qz.answered = true;
  const ans = decodeURIComponent(btn.dataset.ans);
  const correct = decodeURIComponent(btn.dataset.correct);
  const ok = ans === correct;
  if(ok) qz.score++;
  document.querySelectorAll('.qopt').forEach(b=>{
    b.disabled = true;
    const ba = decodeURIComponent(b.dataset.ans);
    if(ba===correct) b.classList.add('ok');
    else if(b===btn && !ok) b.classList.add('ko');
  });
  const fb = document.getElementById('qz-fb');
  fb.textContent = ok ? '✓ ¡Correcto!' : `✗ Era: ${correct}`;
  fb.className = 'qz-fb show '+(ok?'ok':'ko');
  document.getElementById('qz-next').classList.add('show');
}

function nextQ() {
  qz.idx++; qz.answered=false; renderQuizQ();
}

function renderQuizResult() {
  const pct = Math.round(qz.score/qz.pool.length*100);
  const emoji = pct>=80?'🏆':pct>=60?'👍':pct>=40?'📚':'💪';
  const msg = pct>=80?'¡Excelente dominio!':pct>=60?'¡Buen trabajo!':pct>=40?'Sigue practicando':'¡Más estudio!';
  state.quizScores = [...(state.quizScores||[]).slice(-9), pct]; save();
  document.getElementById('quiz-content').innerHTML = `
    <div class="qz-result">
      <div class="qr-emoji">${emoji}</div>
      <div class="qr-score">${qz.score}/${qz.pool.length}</div>
      <div class="qr-label">${msg} · ${pct}% acierto</div>
      <button class="qr-restart" onclick="startQuiz()">🔄 Jugar de nuevo</button>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// PROGRESS
// ══════════════════════════════════════════════════════════════
function renderProgress() {
  const total = LESSONS.length;
  const done = Object.values(state.done).filter(Boolean).length;
  const favs = Object.values(state.favs).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const avgQ = state.quizScores?.length ? Math.round(state.quizScores.reduce((a,b)=>a+b,0)/state.quizScores.length) : 0;
  const n5d = LESSONS.filter(l=>l.num<=25&&state.done[l.num]).length;
  const n4d = LESSONS.filter(l=>l.num>25&&l.num<=40&&state.done[l.num]).length;
  const n3d = LESSONS.filter(l=>l.num>40&&state.done[l.num]).length;

  document.getElementById('prog-content').innerHTML = `
    <div class="prog-hero">
      <div class="prog-pct">${pct}%</div>
      <div class="prog-lbl">${done} de ${total} lecciones completadas</div>
      <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="streak">
      <span style="font-size:26px">🔥</span>
      <div><div class="streak-num">${state.streak||1} día${state.streak!==1?'s':''}</div><div class="streak-lbl">Racha de estudio</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--green)">${done}</div><div class="stat-l">Completadas</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--gold)">${favs}</div><div class="stat-l">Favoritas ⭐</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--teal)">${avgQ}%</div><div class="stat-l">Promedio Quiz</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--purple)">${state.quizScores?.length||0}</div><div class="stat-l">Quizzes</div></div>
    </div>
    <div class="d-section-head">Progreso por nivel</div>
    ${lvlBar('N5 — Básico (L1–25)', n5d, 25, 'var(--green)')}
    ${lvlBar('N4 — Intermedio (L26–40)', n4d, 15, 'var(--teal)')}
    ${lvlBar('N3 — Avanzado (L41–50)', n3d, 10, 'var(--purple)')}
    ${state.quizScores?.length ? `
    <div class="d-section-head" style="margin-top:12px">Últimas puntuaciones Quiz</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${[...state.quizScores].reverse().map(s=>`
        <div style="background:var(--card);border-radius:8px;padding:5px 10px;border:1px solid var(--border);font-weight:700;font-size:13px;color:${s>=80?'var(--green)':s>=60?'var(--gold)':'var(--red)'}">${s}%</div>
      `).join('')}
    </div>` : ''}
    <div class="d-section-head">Opciones de visualización</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button onclick="state.showFurigana=!state.showFurigana;save();renderProgress()" style="background:${state.showFurigana?'rgba(162,155,254,.2)':'var(--card)'};border:1px solid ${state.showFurigana?'var(--purple)':'var(--border)'};color:${state.showFurigana?'var(--purple)':'var(--muted)'};border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700">🈺 Furigana ${state.showFurigana?'ON':'OFF'}</button>
      <button onclick="state.showRomaji=!state.showRomaji;save();renderProgress()" style="background:${state.showRomaji?'rgba(0,206,201,.2)':'var(--card)'};border:1px solid ${state.showRomaji?'var(--teal)':'var(--border)'};color:${state.showRomaji?'var(--teal)':'var(--muted)'};border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700">🔤 Romaji ${state.showRomaji?'ON':'OFF'}</button>
    </div>
    <button class="reset-btn" onclick="confirmReset()">🗑️ Reiniciar todo el progreso</button>
  `;
}

function lvlBar(label, done, total, color) {
  const p = Math.round(done/total*100);
  return `<div class="lvl-bar">
    <div class="lvl-top"><span class="lvl-name">${label}</span><span class="lvl-cnt">${done}/${total}</span></div>
    <div class="lvl-track"><div class="lvl-fill" style="width:${p}%;background:${color}"></div></div>
  </div>`;
}

function confirmReset() {
  if(confirm('¿Reiniciar todo el progreso? No se puede deshacer.')) {
    state = { done:{}, favs:{}, streak:1, lastStudied:new Date().toDateString(), quizScores:[], showRomaji:true, showFurigana:true };
    save(); renderProgress(); renderLessons();
  }
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
init();
</script>
</body>
